# Machine-readable form of docs/test-scenarios.md.
#
# One entry per scenario, same IDs. The document remains the authority for the
# prose (expected behaviour, pass and fail conditions); this file carries only
# what an automated evaluator needs: the starting state, what the customer
# says, and the expected end state, captured values and behaviours.
#
# ALL CUSTOMER DATA IS SYNTHETIC.
#
# Field reference (see evaluation/README.md for the full format):
#   basis        source, or the list of design decisions (DD-*) and prompt-policy
#                decisions (PD-*) the expected behaviour rests on. Both are
#                project choices, not something the assignment PDF states.
#   profile      prompt-variable set from profiles.yaml (default: default_en)
#   rag_context  overrides additional_context_from_rag for this scenario
#   start        state before the first customer turn
#     answered   field values already captured (amounts in Lakhs, tenure in years)
#     pending    the point the agent has just asked, if any
#     clarified  tracked items whose one clarification or re-ask is already used
#                (PD-01): a field name, or a branch response from vocabulary.yaml.
#                Bookkeeping only; these are not eligibility points.
#   expected
#     end_state      state after the agent's response to the last turn
#     call_outcome   set only when end_state is CALL_TERMINATION
#     fields         values captured or replaced during the scenario
#     optional_fields values the agent may capture but is not required to
#     next_pending   the point the agent should ask next (a list = any of)
#     transitions    T-nn taken, in order
#     must / must_not  behaviour labels from vocabulary.yaml

version: 1
synthetic: true

# Starting-state presets. "P1-P3 answered" in the document means these values.
presets:
  none: &none {}
  p1: &p1
    property_type: Residential
  p1_p2: &p1_p2
    property_type: Residential
    ownership_status: Sole
  p1_p3: &p1_p3
    property_type: Residential
    ownership_status: Sole
    documents_available: available
  p1_p4: &p1_p4
    property_type: Residential
    ownership_status: Sole
    documents_available: available
    loan_amount: 40
  p1_p5: &p1_p5
    property_type: Residential
    ownership_status: Sole
    documents_available: available
    loan_amount: 40
    occupation: Salaried
    income_mode: Bank
  p1_p6: &p1_p6
    property_type: Residential
    ownership_status: Sole
    documents_available: available
    loan_amount: 40
    occupation: Salaried
    income_mode: Bank
    market_value: 120

scenarios:

  # ------------------------------------------------------------ A. Happy path
  - id: TS-A1
    title: All seven points eligible, answered in order
    basis: source
    start: {state: GREETING, identity_verified: false, offer_presented: false, answered: *none, pending: null}
    customer_turns:
      - "Yes, this is Rahul speaking."
      - "Okay, sounds interesting, tell me more."
      - "It's a two-bedroom flat, we live in it."
      - "It's in my name only."
      - "Yes, I've got the original papers at home."
      - "I'm thinking around forty lakhs."
      - "I work at an IT company, salary comes into my bank account every month."
      - "Must be about one crore twenty lakhs now."
      - "I'd like to repay over ten years."
    expected:
      end_state: CALL_TERMINATION
      call_outcome: QUALIFIED
      fields:
        property_type: Residential
        ownership_status: Sole
        documents_available: available
        loan_amount: 40
        occupation: Salaried
        income_mode: Bank
        market_value: 120
        tenure_years: 10
      next_pending: null
      transitions: [T-01, T-02, T-03, T-05, T-06, T-12, T-16]
      must: [greet_and_introduce, verify_identity, present_offer, handoff_message, end_call]
      must_not: [reask_answered_point, invent_interest_rate, apply_unlisted_eligibility_rule]

  - id: TS-A2
    title: Industrial property is accepted
    basis: source
    start: {state: ELIGIBILITY_COLLECTION, identity_verified: true, offer_presented: true, answered: *none, pending: property_type}
    customer_turns:
      - "It's a small factory unit in the industrial area."
    expected:
      end_state: ELIGIBILITY_COLLECTION
      call_outcome: null
      fields: {property_type: Industrial}
      next_pending: ownership_status
      transitions: [T-06]
      must: [ask_pending_point]
      must_not: [disqualification_message, reask_answered_point]

